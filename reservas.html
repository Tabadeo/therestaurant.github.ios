<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Único - Reservas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">Sabor<span>Único</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="menú.html">Menú</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="reservas.html" class="active">Reservas</a></li>
            <li><a href="contacto.html">Contactos</a></li>
            <li><a href="registro.html" class="btn-nav-login">Iniciar Sesión</a></li>
            
        </ul>
    </header>

    <main class="container">
        <h1 class="page-title">Reserva tu Mesa</h1>
        <p class="page-subtitle">Asegura tu lugar con anticipación</p>

        <div class="card-form-container">
            <form action="confirmacion_reservas.html" method="get">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>
               <div class="form-group">
    <label for="personas">Número de Personas</label>
    <input type="number" id="personas" min="1" max="20" value="2" required>
</div>
    <div class="form-group">
        <label for="zona">Zona del Restaurante</label>
            <select id="zona" required>
              <option value="salon">Salón Principal</option>
                <option value="terraza">Terraza</option>
                <option value="vip">Zona VIP</option>
            </select>
    </div>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Confirmar Reserva</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Restaurante Sabor Único. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
