<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Único - Crear Cuenta</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">Sabor<span>Único</span></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html" class="btn-nav-login active">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="container card-form-container">
        <section class="card-form">
            <h1 class="page-title" style="font-size: 1.8rem;">Crear Cuenta</h1>
            <p class="page-subtitle" style="margin-bottom: 1.5rem;">Registrate para gestionar tus reservas</p>

            <form action="registrado.html" method="get">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" placeholder="Tadeo Pérez" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-pass">Contraseña</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="reg-pass-confirm">Confirmar Contraseña</label>
                    <input type="password" id="reg-pass-confirm" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 1rem;">Registrarse</button>

                <p style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    ¿Ya tienes una cuenta? <a href="registro.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Inicia Sesión</a>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Restaurante Sabor Único. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
